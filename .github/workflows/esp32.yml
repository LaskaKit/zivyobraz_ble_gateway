# ESP32 gateway: PC tests against the Python gateway, firmware build, and on a tag "v*"
# a GitHub release with the signed binaries (zivyobraz-ble-gateway-esp32-<version>-full.bin / -ota.bin)
# and latest.json, which the gateways' update check reads (esp32/main/update.h).
name: esp32

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["esp32/**", "web/**", "python/picksmart/**", "python/zivyobraz_ble_gateway/**", ".github/workflows/esp32.yml"]
  pull_request:
    paths: ["esp32/**", "web/**", "python/picksmart/**", "python/zivyobraz_ble_gateway/**", ".github/workflows/esp32.yml"]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: PYTHON=python esp32/test/host/run.sh

  build:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      # Releases are signed (esp32/SECURITY.md): the RSA-3072 key is the repository secret ZO_SIGNING_KEY
      # (the whole PEM file). Only tag builds get it; other builds are unsigned and only for testing.
      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.ZO_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret ZO_SIGNING_KEY is not set: a release must be signed"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > esp32/signing_key.pem
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32
          path: esp32
          command: ./release.sh ${{ startsWith(github.ref, 'refs/tags/v') && format('--tag {0}', github.ref_name) || '' }}
      - name: Remove the signing key
        if: always()
        run: sudo rm -f esp32/signing_key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: zivyobraz-ble-gateway-esp32
          path: esp32/dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp32/dist/*
